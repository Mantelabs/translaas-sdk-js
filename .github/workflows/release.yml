name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # setup-node + registry-url writes ~/.npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
    # changesets/action keeps that file if an auth line exists and does not inject NPM_TOKEN.
    # Without NODE_AUTH_TOKEN, publishes see an empty token and npm returns a misleading E404.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    # Do not skip version-package commits. This repo squash-merges only, so the
    # Changesets PR lands as a "chore: version packages" commit; that merge is
    # what must publish to npm. changesets/action is a no-op when there is
    # nothing left to version or publish.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Mantelabs org policy blocks GITHUB_TOKEN from creating PRs.
          # Prefer a PAT/GitHub App token with contents + pull requests.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # Per-package git tags/releases are disabled; npm run release pushes one v* tag instead.
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
